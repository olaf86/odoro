name: Unity CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build the iOS Xcode project artifact
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  UNITY_VERSION: 6000.4.6f1
  XCODE_CLOUD_BRANCH: xcode-cloud/ios

jobs:
  editmode-tests:
    name: EditMode tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: editmode
          checkName: EditMode tests
          artifactsPath: artifacts/test-results/editmode

      - name: Upload EditMode test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: artifacts/test-results/editmode
          if-no-files-found: ignore

  ios-xcode-project:
    name: iOS Xcode project
    runs-on: ubuntu-latest
    needs: editmode-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-iOS-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: Odoro.Editor.CiBuild.BuildIosXcodeProject
          customParameters: -ciOutputPath Builds/iOS -ciBuildNumber ${{ github.run_number }}

      - name: Upload iOS Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: odoro-ios-xcode-project
          path: Builds/iOS
          if-no-files-found: error

      - name: Publish Xcode project for Xcode Cloud
        if: ${{ github.ref_name == 'main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${publish_dir}"
          cd "${publish_dir}"

          if git ls-remote --exit-code --heads origin "${XCODE_CLOUD_BRANCH}"; then
            git checkout "${XCODE_CLOUD_BRANCH}"
            git rm -r --ignore-unmatch .
          else
            git checkout --orphan "${XCODE_CLOUD_BRANCH}"
            git rm -r --ignore-unmatch .
          fi

          cp -R "${GITHUB_WORKSPACE}/Builds/iOS/." "${publish_dir}/"
          cat > .gitignore <<'EOF'
          DerivedData/
          build/
          xcuserdata/
          *.xcuserstate
          EOF
          cat > ODORO_UNITY_SOURCE.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          source_branch=${GITHUB_REF_NAME}
          source_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          git add .
          if git diff --cached --quiet; then
            echo "No generated Xcode project changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated iOS Xcode project from ${GITHUB_SHA::7}"
          git push origin "${XCODE_CLOUD_BRANCH}"
