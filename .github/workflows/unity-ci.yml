name: Unity CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build the iOS Xcode project artifact
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  UNITY_VERSION: 6000.4.6f1

jobs:
  editmode-tests:
    name: EditMode tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: editmode
          checkName: EditMode tests
          artifactsPath: artifacts/test-results/editmode

      - name: Upload EditMode test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: artifacts/test-results/editmode
          if-no-files-found: ignore

  ios-xcode-project:
    name: iOS Xcode project
    runs-on: ubuntu-latest
    needs: editmode-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-iOS-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: Odoro.Editor.CiBuild.BuildIosXcodeProject
          customParameters: -ciOutputPath Builds/iOS -ciBuildNumber ${{ github.run_number }}

      - name: Upload iOS Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: odoro-ios-xcode-project
          path: Builds/iOS
          if-no-files-found: error
