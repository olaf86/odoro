name: Unity CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build the iOS Xcode project artifact
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  UNITY_VERSION: 6000.4.6f1
  XCODE_CLOUD_REPOSITORY: olaf86/odoro-ios-xcode
  XCODE_CLOUD_BRANCH: main

jobs:
  editmode-tests:
    name: EditMode tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: editmode
          checkName: EditMode tests
          artifactsPath: artifacts/test-results/editmode

      - name: Upload EditMode test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: artifacts/test-results/editmode
          if-no-files-found: ignore

  ios-xcode-project:
    name: iOS Xcode project
    runs-on: ubuntu-latest
    needs: editmode-tests
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_ios) }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-iOS-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: Odoro.Editor.CiBuild.BuildIosXcodeProject
          customParameters: -ciOutputPath Builds/iOS -ciBuildNumber ${{ github.run_number }}

      - name: Upload iOS Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: odoro-ios-xcode-project
          path: Builds/iOS
          if-no-files-found: error

      - name: Publish Xcode project for Xcode Cloud
        if: ${{ github.ref_name == 'main' }}
        env:
          XCODE_CLOUD_PUBLISH_TOKEN: ${{ secrets.XCODE_CLOUD_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${XCODE_CLOUD_PUBLISH_TOKEN}" ]; then
            echo "XCODE_CLOUD_PUBLISH_TOKEN secret is required to publish to ${XCODE_CLOUD_REPOSITORY}."
            exit 1
          fi

          publish_dir="$(mktemp -d)"
          git clone --no-checkout "https://x-access-token:${XCODE_CLOUD_PUBLISH_TOKEN}@github.com/${XCODE_CLOUD_REPOSITORY}.git" "${publish_dir}"
          cd "${publish_dir}"

          if ! git ls-remote --exit-code --heads origin "${XCODE_CLOUD_BRANCH}"; then
            echo "Branch ${XCODE_CLOUD_BRANCH} does not exist in ${XCODE_CLOUD_REPOSITORY}. Create the private repository and branch once before publishing Xcode Cloud builds."
            exit 1
          fi

          git checkout "${XCODE_CLOUD_BRANCH}"
          git lfs install --local
          git rm -r --ignore-unmatch .

          cp -R "${GITHUB_WORKSPACE}/Builds/iOS/." "${publish_dir}/"
          cat > .gitignore <<'EOF'
          /DerivedData/
          /build/
          xcuserdata/
          *.xcuserstate
          EOF
          cat > ODORO_UNITY_SOURCE.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          source_branch=${GITHUB_REF_NAME}
          source_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          app_name="$(ruby -ne 'if /PRODUCT_NAME_APP = "?([^";]+)"?;/; puts $1; exit; end' Unity-iPhone.xcodeproj/project.pbxproj || true)"
          if [ -n "${app_name}" ] && [ -f Unity-iPhone.xcodeproj/xcshareddata/xcschemes/Unity-iPhone.xcscheme ]; then
            export ODORO_APP_BUILDABLE_NAME="${app_name}.app"
            ruby -0pi -e 'gsub(/BuildableName\s*=\s*"Unity-Target-New\.app"/, "BuildableName = \"#{ENV.fetch("ODORO_APP_BUILDABLE_NAME")}\"")' Unity-iPhone.xcodeproj/xcshareddata/xcschemes/Unity-iPhone.xcscheme
          fi
          mkdir -p Unity-iPhone.xcodeproj/project.xcworkspace
          cat > Unity-iPhone.xcodeproj/project.xcworkspace/contents.xcworkspacedata <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace
             version = "1.0">
             <FileRef
                location = "self:">
             </FileRef>
          </Workspace>
          EOF
          mkdir -p Unity-iPhone.xcworkspace/xcshareddata/xcschemes
          cat > Unity-iPhone.xcworkspace/contents.xcworkspacedata <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace
             version = "1.0">
             <FileRef
                location = "group:Unity-iPhone.xcodeproj">
             </FileRef>
          </Workspace>
          EOF
          if [ -f Unity-iPhone.xcodeproj/xcshareddata/xcschemes/Unity-iPhone.xcscheme ]; then
            cp Unity-iPhone.xcodeproj/xcshareddata/xcschemes/Unity-iPhone.xcscheme Unity-iPhone.xcworkspace/xcshareddata/xcschemes/Unity-iPhone.xcscheme
          fi
          ruby -0pi -e 'gsub(/\$\(TOOLCHAIN_DIR\)\/usr\/lib\/swift/, "$(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift")' Unity-iPhone.xcodeproj/project.pbxproj

          while IFS= read -r -d '' large_file; do
            git lfs track --filename "${large_file#./}"
          done < <(find . -type f -size +95M ! -path './.git/*' -print0)

          git add .
          if git diff --cached --quiet; then
            echo "No generated Xcode project changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated iOS Xcode project from ${GITHUB_SHA::7}"

          local_sha="$(git rev-parse HEAD)"
          for attempt in 1 2 3; do
            if git \
              -c http.version=HTTP/1.1 \
              -c http.lowSpeedLimit=0 \
              -c http.lowSpeedTime=999999 \
              push origin "HEAD:${XCODE_CLOUD_BRANCH}"; then
              exit 0
            fi

            remote_sha="$(git ls-remote origin "refs/heads/${XCODE_CLOUD_BRANCH}" | awk '{print $1}')"
            if [ "${remote_sha}" = "${local_sha}" ]; then
              echo "Remote branch ${XCODE_CLOUD_BRANCH} already points at ${local_sha}; treating push as successful."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 15))
          done

          echo "Failed to publish ${local_sha} to ${XCODE_CLOUD_BRANCH} after 3 attempts."
          exit 1
